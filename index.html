async function open_(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));const h=new TextDecoder().decode(pt);document.body.innerHTML='';document.body.style.margin='0';
 const f=document.createElement('iframe');f.srcdoc=h;f.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;border:0;background:#12161c';document.body.appendChild(f)}
async function fromRaw(raw){return crypto.subtle.importKey('raw',b64(raw),'AES-GCM',false,['decrypt'])}
async function fromPw(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
const $p=document.getElementById('p'),$r=document.getElementById('r'),$b=document.getElementById('b'),$m=document.getElementById('m');
(async()=>{let k=null;try{k=localStorage.getItem('fk')}catch(e){}
 if(k){try{await open_(await fromRaw(k));return}catch(e){try{localStorage.removeItem('fk')}catch(_){}}}
 const go=async()=>{$m.textContent='';try{const key=await fromPw($p.value);await open_(key);
